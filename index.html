<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Guessing Game</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);padding:20px}.card{width:100%;max-width:470px;background:#fff;border-radius:24px;padding:32px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}h1{margin:0 0 8px}.subtitle{color:#666;margin-bottom:24px}.difficulty{display:flex;gap:8px;margin-bottom:22px}.difficulty button{flex:1;padding:10px;border:1px solid #ddd;background:#fafafa;border-radius:10px;cursor:pointer}.difficulty button.active{background:#667eea;color:#fff;border-color:#667eea}input[type=number]{width:100%;padding:15px;border:2px solid #ddd;border-radius:12px;font-size:18px;text-align:center;outline:none}input[type=number]:focus{border-color:#667eea}.guess-btn,.new-btn{width:100%;padding:14px;margin-top:12px;border:0;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer}.guess-btn{background:#667eea;color:#fff}.guess-btn:disabled{opacity:.5;cursor:not-allowed}.new-btn{background:#222;color:#fff}.message{margin:20px 0;padding:14px;background:#f5f5f5;border-radius:12px;min-height:48px}.stats{display:flex;justify-content:space-around;margin-top:18px}.stat strong{display:block;font-size:22px}.stat span{color:#777;font-size:13px}@media(max-width:430px){.card{padding:24px 18px}}
</style>
</head>
<body>
<div class="card">
<h1>🎯 Number Guessing Game</h1>
<div class="subtitle">Can you guess the secret number?</div>
<form method="POST"><input type="hidden" name="action" value="new_game"><div class="difficulty">
{% for key,item in {"easy":"Easy","medium":"Medium","hard":"Hard"}.items() %}<button name="difficulty" value="{{key}}" class="{{'active' if difficulty==key else ''}}">{{item}}</button>{% endfor %}
</div></form>
<p>Guess between <b>1 and {{settings.max}}</b></p>
<form method="POST"><input type="hidden" name="action" value="guess"><input type="number" name="guess" min="1" max="{{settings.max}}" placeholder="Enter your guess" required {% if game_over %}disabled{% endif %}><button class="guess-btn" type="submit" {% if game_over %}disabled{% endif %}>Guess</button></form>
<div class="message">{{message}}</div>
<div class="stats"><div class="stat"><strong>{{attempts}}</strong><span>Attempts</span></div><div class="stat"><strong>{{remaining}}</strong><span>Remaining</span></div></div>
<form method="POST"><input type="hidden" name="action" value="new_game"><input type="hidden" name="difficulty" value="{{difficulty}}"><button class="new-btn" type="submit">🔄 New Game</button></form>
</div>
</body>
</html>
